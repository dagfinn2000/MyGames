name: mygames

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mygames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mygames}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mygames} -d ${POSTGRES_DB:-mygames}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Assembled here from the POSTGRES_* values so there is exactly one
      # place to configure credentials. (The DATABASE_URL in .env is only
      # for running the app / prisma CLI outside Docker.)
      DATABASE_URL: postgresql://${POSTGRES_USER:-mygames}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mygames}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Optional: IGDB in game search (a free Twitch developer app, see
      # .env.example). Wikipedia and Steam need no keys.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      COVERS_DIR: /app/data/covers
      COVER_FETCH_ALLOW_PRIVATE: ${COVER_FETCH_ALLOW_PRIVATE:-false}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
    volumes:
      - covers:/app/data/covers
    depends_on:
      db:
        condition: service_healthy
    # Reports whether the app is actually serving, not merely that the process
    # is alive — a container stuck on a failed migration would otherwise look
    # healthy to anything watching it. /login is the one page that needs no
    # session.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata: # Postgres data — your entire library lives here
  covers: # locally cached cover images
